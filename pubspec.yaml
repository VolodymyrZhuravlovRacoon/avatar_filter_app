name: avatar_filter_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  flutter_staggered_animations: ^1.1.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: 5.4.4
  build_runner: ^2.4.15

flutter:
  uses-material-design: true

  assets:
    - assets/images/
  fonts:
    - family: ItalianPlate
      fonts:
        - asset: assets/fonts/italian_plate/Italian Plate No2 Expanded.ttf